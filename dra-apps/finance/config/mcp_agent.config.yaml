# see https://docs.mcp-agent.com/reference/configuration
$schema: ../../../schema/mcp-agent.config.schema.json

name: deep_research_agent
execution_engine: asyncio

logger:
  transports: [file]
  level: debug # debug, info, warning, error
  progress_display: true
  path_settings:
    # Logs rel
    path_pattern: "./logs/finance/finance-{unique_id}.jsonl"
    unique_id: "timestamp" # Options: "timestamp" or "session_id"
    timestamp_format: "%Y%m%d_%H%M%S"

mcp:
  servers:
    fetch:
      command: "uvx"
      args: ["mcp-server-fetch"]
    yfmcp:
      command: "uvx"
      args: ["yfmcp@latest"]
    financial-datasets:
      command: "npx"
      args: ["-y", "mcp-remote", "https://mcp.financialdatasets.ai/mcp"]
    filesystem:
      command: "npx"
      args: ["-y", "@modelcontextprotocol/server-filesystem", ".."]
    excel_writer:
      command: "uvx"
      args: ["excel-mcp-server", "stdio"]
    memmachine:
      # MemMachine: open-source long-term memory layer for AI agents.
      # Persists episodic + semantic memory across research sessions so
      # the Deep Orchestrator can recall prior findings, user preferences,
      # and intermediate analysis.
      #
      # Prereq: a running MemMachine Docker container named `memmachine-app`
      # (see https://github.com/MemMachine/MemMachine ->
      # `./memmachine-compose.sh`).
      #
      # If you have MemMachine installed locally instead of via Docker,
      # replace this block with:
      #   command: "memmachine-mcp-stdio"
      #   env:
      #     MEMORY_CONFIG: "/absolute/path/to/cfg.yml"
      #     MM_USER_ID: "dra-finance"
      #     PYTHONUNBUFFERED: "1"
      command: "docker"
      args: ["exec", "-i", "memmachine-app", "/app/.venv/bin/memmachine-mcp-stdio"]
      env:
        MEMORY_CONFIG: "/app/configuration.yml"
        MM_USER_ID: "dra-finance"
        MM_PROJ_ID: "dra-finance"
        MM_ORG_ID: "ai-alliance"
        PYTHONUNBUFFERED: "1"
      
# Since Ollama and OpenAI use the same internal code path, i.e.,
# mcp-agent's `OpenAIAugmentedLLM`, the definition for "openai:"
# here is actually for inference through ollama.
# Change the default model if you prefer to use another one.
openai:
  default_model: "gpt-4o-mini"
  reasoning_effort: "medium"
  base_url: "https://api.openai.com/v1"
  
anthropic:
  default_model: "claude-3-5-sonnet-20241022"
