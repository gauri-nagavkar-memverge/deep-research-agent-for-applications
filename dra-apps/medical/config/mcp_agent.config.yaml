# see https://docs.mcp-agent.com/reference/configuration
$schema: ../../../schema/mcp-agent.config.schema.json

name: deep_research_agent
execution_engine: asyncio

logger:
  transports: [file]
  level: debug # debug, info, warning, error
  progress_display: true
  path_settings:
    # Logs rel
    path_pattern: "./logs/medical/medical-{unique_id}.jsonl"
    unique_id: "timestamp" # Options: "timestamp" or "session_id"
    timestamp_format: "%Y%m%d_%H%M%S"

mcp:
  servers:
    fetch:
      command: "uvx"
      args: ["mcp-server-fetch"]
    medical-mcp:
      command: "node"
      args: ["/opt/homebrew/lib/node_modules/medical-mcp/build/index.js"]
    filesystem:
      command: "npx"
      args: ["-y", "@modelcontextprotocol/server-filesystem", ".."]
    memmachine:
      # MemMachine: open-source long-term memory layer for AI agents.
      # See examples/with-memmachine/README.md and
      # https://github.com/MemMachine/MemMachine
      command: "docker"
      args: ["exec", "-i", "memmachine-app", "/app/.venv/bin/memmachine-mcp-stdio"]
      env:
        MEMORY_CONFIG: "/app/configuration.yml"
        MM_USER_ID: "dra-medical"
        MM_PROJ_ID: "dra-medical"
        MM_ORG_ID: "ai-alliance"
        PYTHONUNBUFFERED: "1"
      
# Since Ollama and OpenAI use the same internal code path, i.e.,
# mcp-agent's `OpenAIAugmentedLLM`, the definition for "openai:"
# here is actually for inference through ollama.
# Change the default model if you prefer to use another one.
openai:
  default_model: "gpt-4o-mini"
  reasoning_effort: "medium"
  base_url: "https://api.openai.com/v1"
  
anthropic:
  default_model: "claude-3-5-sonnet-20241022"
